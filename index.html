<title>تنظيف البيت</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#1b2347;--mute:#6c7597;--line:#e7ebf7;--blue:#2f5bff;--green:#16a870;--amber:#f59f0b;--red:#e5484d;--purple:#8b5cf6;--gray:#98a1bd;--r:22px;--sh:0 10px 34px rgba(52,72,140,.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{--bg:#f7f8fc;font-family:"SF Arabic","Geeza Pro","Tajawal","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;background:#f7f8fc;color:var(--ink);min-height:100vh;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid rgba(47,91,255,.55);outline-offset:2px;border-radius:10px}
.app{overflow-x:hidden;max-width:1400px;margin:0 auto;padding:18px 20px 36px}
.i{display:block;flex:none}
#view,.card,.today>*,.page>*{min-width:0}
body{overflow-x:hidden}
/* header */
.top{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.top>*{direction:rtl}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#4d74ff,#2f5bff);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(47,91,255,.32)}
.brand h1{font-size:28px;font-weight:800;line-height:1.1}
.brand p{font-size:14px;color:var(--mute);margin-top:2px}
.datepill{background:#e4eaff;border-radius:22px;padding:10px 24px;font-weight:700;display:flex;align-items:center;gap:10px;color:#22307a}
.datepill small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.greet{display:flex;align-items:center;gap:12px}
.greet .g1{font-weight:800;font-size:17px}
.greet .g2{font-size:13px;color:var(--mute)}
.greet .leaf{font-size:34px}
/* shell */
.shell{direction:ltr;display:grid;grid-template-columns:92px minmax(0,1fr);gap:18px;align-items:start}
.shell>*{direction:rtl}
.side{position:sticky;top:18px;display:flex;flex-direction:column;gap:10px}
.nb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:20px;background:rgba(255,255,255,.72);color:var(--mute);font-size:13px;font-weight:700;transition:background .2s,color .2s}
.nb:hover{background:#fff}
.nb.on{background:var(--blue);color:#fff;box-shadow:0 12px 26px rgba(47,91,255,.35)}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cardhead h3{font-size:19px;font-weight:800}
.cardhead .ic{color:var(--blue)}
/* today grid */
.today{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"map side" "rooms side" "banner banner";gap:18px}
.today>*{direction:rtl}
.ar-map{grid-area:map;min-width:0}
.ar-side{grid-area:side;display:flex;flex-direction:column;gap:18px;min-width:0}
.ar-status{grid-area:auto}
.ar-now{grid-area:auto}
.ar-rooms{grid-area:rooms}
.ar-banner{grid-area:banner}
svg.plan{direction:ltr;width:100%;height:auto;display:block;filter:drop-shadow(0 20px 22px rgba(70,55,30,.26))}
.chip{cursor:pointer;filter:drop-shadow(0 3px 5px rgba(30,40,90,.28))}
.chip:focus-visible{outline:none}
.chip:focus-visible .cr{stroke:#2f5bff;stroke-width:3}
.ct{font-weight:800;font-family:inherit}
.hit{fill:rgba(0,0,0,0);cursor:pointer;transition:fill .2s}
.hit:hover{fill:rgba(47,91,255,.13)}
.sel-zone{fill:none;stroke:#2f5bff;stroke-width:5;stroke-dasharray:10 7;pointer-events:none}
@keyframes pulse{50%{opacity:.35}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:10px;font-size:13px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:11px;height:11px;border-radius:50%;display:block}
/* status card */
.ringw{position:relative;width:176px;height:176px;margin:4px auto 14px}
.ringw .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringw .rc b{font-size:38px;font-weight:800;line-height:1}
.ringw .rc span{font-size:14px;color:var(--mute);margin-top:4px}
.pillr{display:flex;align-items:center;gap:10px;background:#f6f8fd;border-radius:16px;padding:10px 14px;margin-top:8px;font-weight:700}
.pillr .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px}
.pillr b{margin-inline-start:auto;font-size:18px}
.pillr .lbl{flex:1}
.pillr b{margin:0}
/* now list */
.nowrow{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:16px;border:1px solid var(--line);margin-bottom:8px;background:#fff}
.nowrow .nt{flex:1;min-width:0;cursor:pointer}
.nowrow .nt b{display:block;font-size:15px}
.nowrow .nt span{font-size:12.5px;color:var(--mute)}
.nowrow .min{font-size:13px;color:var(--mute);text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:14px 18px;font-weight:800;font-size:17px}
.btn.p{background:linear-gradient(180deg,#3d68ff,#2a52ee);color:#fff;box-shadow:0 12px 24px rgba(47,91,255,.32);width:100%}
.btn.s{background:#eef1fb;color:#26326f}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:14px}
.btn.wide{width:100%}
/* rooms strip */
.rooms{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.rc2{flex:0 0 112px;scroll-snap-align:start;text-align:center;border:1px solid var(--line);border-radius:18px;padding:10px 6px 12px;background:#fff;transition:transform .2s,box-shadow .2s}
.rc2:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.rc2 .th{width:64px;height:52px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#f4ece0,#ead9bd)}
.rc2 b{display:block;font-size:14px}
.rc2 .n{font-size:13px;font-weight:800;margin-top:2px}
.rc2 small{font-size:12px;font-weight:700}
.banner{display:flex;gap:14px;align-items:center;direction:ltr}
.banner>*{direction:rtl}
.banner .msg{flex:1;background:#e9ecfb;border-radius:22px;padding:18px;text-align:center;font-weight:700;color:#3a4696}
.banner .chipok{background:#d7f3e8;color:#0f7a52;border-radius:22px;padding:16px 26px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
/* pages */
.page{display:grid;gap:16px}
.page h2{font-size:24px;font-weight:800}
.sub{color:var(--mute);font-size:14px}
.hh{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hh .rw{position:relative;width:110px;height:110px}
.hh .rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{padding:8px 16px;border-radius:14px;background:#fff;color:var(--mute);font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(52,72,140,.07)}
.chipb.on{background:var(--blue);color:#fff}
.zc{padding:16px}
.zh{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.zh h3{font-size:18px;font-weight:800;flex:1}
.bar{height:8px;border-radius:8px;background:#edf0fa;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .5s}
.stc{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.trow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.ck{width:32px;height:32px;border-radius:50%;border:2.5px solid #c3cbeb;flex:none;display:grid;place-items:center;color:#fff;transition:background .2s,border-color .2s,transform .15s}
.ck:active{transform:scale(.9)}
.ck.on{background:var(--green);border-color:var(--green)}
.tt{flex:1;min-width:0}
.tn{font-weight:700;font-size:15px}
.trow.done .tn{color:var(--mute);text-decoration:line-through;text-decoration-color:#b7c0e0}
.ts{font-size:12.5px;color:var(--mute)}
.ts.overdue{color:var(--red);font-weight:700}
.ts.due{color:#b26a00;font-weight:700}
.ts.done{color:var(--green);font-weight:700}
.ts i{font-style:normal;margin:0 6px;opacity:.5}
.fsel{background:#f2f5fd;border:0;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;color:#334085;max-width:118px}
.gh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:14px 0 2px;color:#2a3470}
.gh i{width:10px;height:10px;border-radius:50%;display:block}
.gh small{margin-inline-start:auto;font-weight:600;color:var(--mute)}
.xbtn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--mute);background:#f2f5fd}
.xbtn:hover{color:var(--red)}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(20,28,70,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:39}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;right:0;width:min(450px,100%);background:#fff;box-shadow:-24px 0 60px rgba(20,30,80,.22);transform:translateX(106%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:40;display:flex;flex-direction:column;border-radius:28px 0 0 28px}
#drawer.open{transform:none}
#drawer:not(.open){pointer-events:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#1b2347;color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:70;font-weight:700;box-shadow:0 12px 30px rgba(20,30,80,.35)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:#fff;color:#1b2347;border-radius:12px;padding:8px 16px;min-height:44px;font-weight:800}
.ck,.xbtn{position:relative}
.ck::after,.xbtn::after{content:'';position:absolute;inset:-7px}
.ck::after{inset:-9.5px}
.fsel{min-height:44px}
.btn.sm,.chipb{min-height:44px}
@media (max-width:860px){.fsel,.addbox input,.addbox select{font-size:16px}.fsel{max-width:132px}.nb{font-size:10.5px}.trow{flex-wrap:wrap}.trow .tt{flex:1 1 150px;min-width:150px}}
#dbody{overflow-y:auto;padding:22px 22px 30px;flex:1;-webkit-overflow-scrolling:touch}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dh .em{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#f4ece0,#ead9bd);display:grid;place-items:center;font-size:28px}
.dh h2{font-size:22px;font-weight:800;flex:1;line-height:1.2}
.dstat{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:#f6f8fd;border-radius:20px;padding:14px;margin-bottom:8px}
.dstat .rw{position:relative;width:84px;height:84px}
.dstat .rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.dstat div p{font-size:13.5px;color:var(--mute)}
.dstat div p b{color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.addbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f6f8fd;border-radius:18px;padding:12px;margin-top:14px}
.addbox input,.addbox select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.addbox .full{grid-column:1/-1}
.addbox h4{grid-column:1/-1;font-size:15px}
/* focus */
#focus{position:fixed;inset:0;background:rgba(20,28,70,.55);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
#focus.on{display:flex}
.fcard{background:#fff;border-radius:30px;padding:26px;max-width:460px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.fcard .em{font-size:44px}
.fcard h2{font-size:26px;margin:8px 0 4px;font-weight:800}
.fcard .fz{color:var(--mute);font-weight:700}
.fcard .fbar{height:8px;border-radius:8px;background:#edf0fa;margin-bottom:18px;overflow:hidden}
.fcard .fbar i{display:block;height:100%;background:var(--blue);border-radius:8px;transition:width .4s}
.fcard .fb{display:grid;gap:10px;margin-top:20px}
/* calendar */
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cgrid .wd{text-align:center;font-size:12.5px;color:var(--mute);font-weight:700;padding:4px 0}
.cd{min-height:66px;border-radius:14px;background:#f6f8fd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;position:relative}
.cd.blank{background:none}
.cd.td{box-shadow:inset 0 0 0 2px var(--blue)}
.cd.sel{background:var(--blue);color:#fff}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:8px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.cd.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.cm{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cm h3{font-size:19px;font-weight:800}
/* reports */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.kpi span{color:var(--mute);font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--blue);min-height:4px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}
.lrow:last-child{border:0}
.lrow .bar{flex:0 0 90px}
.lrow em{font-style:normal;margin-inline-start:auto;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.hday{margin-bottom:12px}
.hday h4{font-size:16px;font-weight:800;margin-bottom:6px}
.hl{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14.5px}
.hl i{width:8px;height:8px;border-radius:50%;display:block}
.hl em{font-style:normal;margin-inline-start:auto;font-weight:800}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
/* mobile */
@media (max-width:1100px){.today{grid-template-columns:minmax(0,1fr) 300px}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){
 .app{padding:10px 8px 24px}
 .shell{grid-template-columns:54px minmax(0,1fr);gap:8px}
 .side{position:sticky;top:8px;gap:6px}
 .nb{padding:9px 0;font-size:10.5px;border-radius:16px;gap:3px}
 .nb.on{box-shadow:0 6px 14px rgba(47,91,255,.3)}
 .top{flex-wrap:wrap}
 .brand h1{font-size:22px}.brand .logo{width:44px;height:44px;border-radius:14px}
 .datepill{padding:7px 14px;font-size:14px}
 .greet{display:none}
 .today{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "side" "rooms" "banner"}
 .kpis,.two{grid-template-columns:1fr 1fr}
 .two{grid-template-columns:1fr}
 #drawer{top:auto;left:0;right:0;width:100%;max-height:92vh;border-radius:28px 28px 0 0;transform:translateY(106%);box-shadow:0 -20px 60px rgba(20,30,80,.25)}
 #drawer.open{transform:none}
 .banner .chipok{display:none}
 .cd{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== image-faithful UI ===== */
.mapwrap{position:relative;width:100%;aspect-ratio:840/770}
.mapimg{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.ov{position:absolute;inset:0;width:100%;height:100%;direction:ltr}
.hdrmid{display:flex;flex-direction:column;align-items:center;gap:8px}
.hdrmid .cap{font-size:13.5px;color:#4a5588}
.nb{background:rgba(255,255,255,.55);border-radius:22px}
.pillr{background:#f5f7fb;border-radius:18px;padding:11px 14px}
.pillr .num{font-size:19px;font-weight:800;min-width:20px}
.pillr .dot{margin-inline-start:auto;width:22px;height:22px;font-size:11px;font-weight:800}
.pillr .lbl{flex:0 1 auto;font-weight:700;color:#37426f}
.pillr.est{padding:12px 16px}
.pillr.est .t2{flex:1}
.pillr.est .t2 small{display:block;color:#37426f;font-weight:700;font-size:14px}
.pillr.est .t2 b{font-size:19px}
.nowrow{border-radius:18px;padding:10px 12px;gap:10px;background:#fff;border:1px solid #edf0fa;box-shadow:0 4px 14px rgba(52,72,140,.05)}
.nowrow .tm{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--mute);min-width:24px;gap:1px}
.nowrow .ck{border-color:#c9d0ee}
.rooms{gap:10px}
.rc2{flex:1 1 0;min-width:84px;padding:8px 4px 10px;border-radius:18px;border:1px solid #edf0fa}
.rc2 b{font-size:13px}
.rc2 .th{width:100%;height:64px;border-radius:14px;background-size:cover;background-position:center;margin-bottom:8px;display:block}
.rc2 .cnt{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;margin-top:2px}
.rc2 .cnt i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}
.banner .msg{background:#e8eafb;color:#3b4692;border-radius:24px}
.banner .chipok{background:linear-gradient(135deg,#d3f4e6,#c2efe0);border-radius:26px;gap:14px;padding:12px 26px;color:#0f7a52}
.banner .chipok .sp{font-size:34px;line-height:1}
.tabs{display:flex;gap:8px}
#bar{max-width:1400px;margin:0 auto}
.bn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:16px;padding:12px 14px;margin:0 0 10px;font-weight:700;font-size:14px;line-height:1.6}
.bn span{flex:1;min-width:220px}
.bn.r{background:#fdeeee;color:#8f1d22}.bn.a{background:#fff4e0;color:#7a4700}
.bn button{background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;min-height:44px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd2{border-radius:18px;background:#fff;box-shadow:var(--sh);padding:12px 4px;text-align:center;font-weight:700;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:118px}
.wd2 small{color:var(--mute);font-weight:700}
.wd2 .n{font-size:22px;font-weight:800}
.wd2.td{box-shadow:inset 0 0 0 2px var(--blue),var(--sh)}
.wd2.sel{background:var(--blue);color:#fff}
.wd2.sel small{color:#dfe6ff}
.wd2.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.dsec{margin-top:12px;padding-top:6px;border-top:1px dashed var(--line)}
.dsec h3{display:flex;align-items:center;gap:8px;font-size:17px;margin:10px 0 0}
.dth{height:90px;border-radius:18px;background-size:cover;background-position:center;margin-bottom:12px}
@media (max-width:860px){.wk{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.wd2{padding:8px 0;min-height:96px;font-size:11px}.wd2 .n{font-size:17px}.hdrmid .cap{display:none}.rc2{flex:0 0 118px}.banner .chipok .sp{font-size:26px}}
@media (max-width:999px){.today{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "side" "rooms" "banner"}.ar-side{display:grid;grid-template-columns:1fr 1fr;align-items:start}}


.nxt{margin-top:8px;text-align:center;font-size:12.5px;color:var(--mute)}.nxt b{color:var(--ink)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid #edf0fa}
.mini{min-width:0}
@media(max-width:700px){.minis{grid-template-columns:1fr;gap:12px}}
.mini h4{font-size:12.5px;color:var(--mute);font-weight:800;margin-bottom:6px}
.mch{display:flex;flex-wrap:wrap;gap:6px}
.mc{display:inline-flex;align-items:center;gap:5px;border:1px solid #edf0fa;background:#f6f8fd;border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;min-height:32px}
.mc i{font-style:normal;font-weight:800;font-size:11.5px}
.mc.late i{color:var(--red)}.mc.redo i{color:#7c4dd8}.mc.todo i{color:var(--amber)}
.mrow{display:flex;flex-direction:column;padding:6px 0;cursor:pointer;border-bottom:1px dashed #edf0fa}.mrow:last-of-type{border-bottom:0}
.mrow b{font-size:13.5px}.mrow span{font-size:12px;color:var(--mute)}
.mmore{font-size:12px;color:var(--blue);font-weight:700;cursor:pointer;padding:4px 0}
.frl{display:grid;gap:8px;margin-top:14px;max-height:52vh;overflow:auto;text-align:right}
.frm{display:flex;align-items:center;gap:10px;border:1px solid #edf0fa;background:#f6f8fd;border-radius:16px;padding:10px 14px;font:inherit;cursor:pointer;min-height:48px}
.frm .e{font-size:22px}.frm b{font-size:15px}.frm .m{margin-inline-start:auto;font-size:12.5px;color:var(--mute)}.frm .m em{font-style:normal;color:var(--red);font-weight:800}
.frm.fin{opacity:.55;cursor:default}
.frow2{display:flex;justify-content:center;gap:14px}

/* ===== iPhone / iOS ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;-webkit-touch-callout:none}
button,[data-act],.hit,.chip,select,summary{touch-action:manipulation}
button{-webkit-appearance:none;appearance:none}
input,select,textarea{-webkit-appearance:none;appearance:none;border-radius:12px}
input,select{font-size:16px}
svg.plan,.chip,.hit{-webkit-user-select:none;user-select:none}
.app{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));padding-bottom:max(36px,calc(env(safe-area-inset-bottom) + 20px))}
#toast{bottom:max(20px,calc(env(safe-area-inset-bottom) + 10px))}
#drawer,#dbody,#focus,.frl{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#dbody{padding-bottom:max(18px,env(safe-area-inset-bottom))}
#focus{padding-bottom:max(18px,env(safe-area-inset-bottom))}
@media (max-width:700px){
 .app{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px))}
 #drawer{max-height:92vh;max-height:92dvh}
 .fcard{max-height:92vh;max-height:92dvh;overflow:auto}
}
@media (hover:none){.hit:hover{fill:transparent}.nb:hover{background:transparent}.nb.on:hover{background:inherit}.rc2:hover{transform:none;box-shadow:none}.xbtn:hover{color:inherit}}
@media (max-width:700px){.bn{font-size:13px;padding:10px 12px;gap:8px;line-height:1.5}.bn button{min-height:40px}}

/* ===== موبايل: كارت الحالة و"على الآن" جنب بعض تحت الخريطة ===== */
@media (max-width:700px){
 .ar-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
 .ar-status,.ar-now{padding:12px 10px;border-radius:22px;min-width:0}
 .ar-side .cardhead{margin-bottom:8px;gap:6px}
 .ar-side .cardhead h3{font-size:15px}
 .ar-side .cardhead .ic svg{width:20px;height:20px}
 .ringw{width:108px;height:108px;margin:0 auto 8px}
 .ringw .rc b{font-size:23px}.ringw .rc span{font-size:11px;margin-top:2px}
 .ringw>svg{width:100%;height:100%}
 .ringw .rc svg{width:16px;height:16px}
 .ar-side .cardhead h3{font-size:14.5px;line-height:1.3}
 .ar-status .pillr{padding:6px 8px;margin-top:5px;border-radius:12px;gap:6px}
 .ar-status .pillr .lbl{font-size:12.5px}
 .ar-status .pillr .num{font-size:15px;min-width:0}
 .ar-status .pillr .dot{display:none}
 .ar-status .pillr .num{margin-inline-start:auto}
 .ar-status .pillr.est{padding:6px 8px}
 .ar-status .pillr.est>span{display:none}
 .ar-status .pillr.est .t2 small{font-size:11.5px}
 .ar-status .pillr.est .t2 b{font-size:14px}
 .ar-now{display:flex;flex-direction:column}
 .ar-now .nowrow{padding:7px 8px;gap:7px;margin-bottom:6px;border-radius:14px}
 .ar-now .nowrow .tm{display:none}
 .ar-now .nowrow .ck{width:26px;height:26px;flex:0 0 26px;order:-1}
 .ar-now .nowrow .nt b{font-size:12.5px;line-height:1.35}
 .ar-now .nowrow .nt span{font-size:11px}
 .ar-now .btn{margin-top:auto!important;padding:11px 6px;font-size:14px;gap:5px}
 .ar-now .btn svg{width:15px;height:15px}
 .ar-now .nxt{font-size:11px;line-height:1.4}
}

.dfocus{margin-inline-start:auto;background:#eef2ff;color:#2f4bb8;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;line-height:1.4;max-width:100%}
.dfocus b{font-weight:800}.dfocus em{font-style:normal;color:var(--red);font-weight:800}
.ar-rooms .cardhead{flex-wrap:wrap;gap:8px}
.rc2{position:relative}
.rc2.istoday{box-shadow:0 0 0 2px var(--blue);border-color:transparent}
.rc2 .tdy{position:absolute;top:-8px;inset-inline-end:8px;background:var(--blue);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;z-index:1}
.zdsel{min-height:34px;padding:4px 8px;font-size:14px;max-width:none;display:inline-block;vertical-align:middle}
</style>

 const cur=totals(S),inc=totals(r.data),drop=r.rep.tasks+r.rep.done+r.rep.days;
 let msg=`استيراد النسخة هيستبدل بياناتك الحالية بالكامل.\n\nالحالية: ${desc(cur)}\nالملف: ${desc(inc)}${r.data.savedAt?'\nآخر حفظ للملف: '+dfmt(Date.parse(r.data.savedAt)):''}`;
 if(inc.comp<cur.comp)msg+=`\n\n⚠️ الملف فيه تنفيذات أقل من بياناتك الحالية (${inc.comp} مقابل ${cur.comp}). ممكن يكون نسخة أقدم.`;
 if(drop)msg+=`\n\nتنبيه: ${drop} سجل غير صالح في الملف هيتم تجاهله.`;
 msg+='\n\nهتتحفظ نسخة أمان من بياناتك الحالية داخل المتصفح ولو ندمت تقدر ترجعها. تكمّل؟';
 if(!confirm(msg))return false;
 const stashed=Store.stashPre(S);
 if(!stashed&&!confirm('تعذّر حفظ نسخة الأمان (المساحة ممتلئة). لو كملت مش هتقدر ترجع بياناتك الحالية. تكمّل برضه؟'))return false;
 const prev=S,prevHold=Store.hold;
 S=r.data;Store.hold=false;
 try{Store.dry=true;render()}catch(e){
  Store.dry=false;S=prev;Store.hold=prevHold;try{render()}catch(_){}
  alert('فشل عرض بيانات الملف، فما اتغيّر أي شيء في بياناتك.');return false;
 }finally{Store.dry=false}
 if(!Store.save(S)){
  S=prev;Store.hold=prevHold;Store.err=null;try{render()}catch(_){}Bar.update();
  alert('تعذّر حفظ البيانات المستوردة على الجهاز (المساحة أو الصلاحيات). رجعت بياناتك الحالية زي ما كانت.');return false;
 }
 render();Bar.update();
 alert(`تم الاستيراد: ${desc(inc)}.`);
 return true;
}

 dismiss:el=>{const k=el.dataset.k;if(k==='rem')Bar.dismissed.rem=true;if(k==='ios'){Bar.dismissed.ios=true;IOS.see()}if(k==='note')Store.note=null;Bar.update()},
 dlCorrupt:()=>{let raw=null;try{raw=localStorage.getItem(CORR)||localStorage.getItem(KEY)}catch(e){}if(!raw)return alert('مفيش بيانات تالفة محفوظة.');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='tandheef-albait-corrupt-'+TD+'.json';document.body.appendChild(a);a.click();a.remove()},
 freshStart:()=>{if(!confirm('هتبدأ ببيانات جديدة فاضية. النسخة التالفة هتفضل محفوظة في المتصفح لو محتاجها. تكمّل؟'))return;Store.hold=false;S=freshState();Store.save(S);render();Bar.update()},
 restorePre:()=>{
  let raw=null;try{raw=localStorage.getItem(PRE)}catch(e){}
  const r=raw&&sanitize(JSON.parse(raw),true);if(!r)return alert('مفيش نسخة أمان صالحة.');
  if(!confirm(`هترجّع بيانات ما قبل آخر استيراد أو إعادة ضبط (${desc(totals(r.data))}) وتستبدل الحالية (${desc(totals(S))}). الحالية هتتحفظ كنسخة أمان بدالها. تكمّل؟`))return;
  Store.stashPre(S);S=r.data;Store.hold=false;Store.save(S);render();Bar.update();
 },
 reset:()=>{
  if(!confirm('سيتم مسح كل المهام والسجل والبدء من جديد. هتتحفظ نسخة أمان من بياناتك الحالية داخل المتصفح (تقدر ترجعها من زر "استرجاع"). متأكد؟'))return;
  Store.stashPre(S);S=freshState();Store.hold=false;Store.save(S);render();Bar.update();
 }
};
const CHG={
 zday:el=>{if(!S.zday)S.zday={};S.zday[el.dataset.z]=+el.value;Store.save(S);render()},
 freq:el=>{const x=taskById(el.dataset.id);x.freq=el.value;Store.save(S);render()},
 tz:el=>{UI.tz=el.value;render()},
 tt:el=>{UI.tt=el.value;render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act]){if(el.dataset.act==='close'&&e.target.closest('#dbody')&&!e.target.closest('[data-act="close"]'))return;ACT[el.dataset.act](el,e)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&(UI.zone||UI.focus)){UI.zone=null;UI.focus=null;render();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();ACT[e.target.dataset.act](e.target)}
});
$('#imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>importText(r.result);
 r.onerror=()=>alert('تعذّرت قراءة الملف. ما اتغيّر أي شيء في بياناتك.');
 r.readAsText(f);e.target.value='';
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,180)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
addEventListener('storage',e=>{
 if(e.key!==KEY||!e.newValue||Store.hold)return;
 try{const r=sanitize(JSON.parse(e.newValue),true);if(r){S=r.data;render()}}catch(x){}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)FSync.flush()});
addEventListener('pagehide',()=>FSync.flush());
render();Bar.update();Persist.init();FSync.init();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
